<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="40%" stop-color="#FF5E00" />
      <stop offset="80%" stop-color="#FF0077" />
      <stop offset="100%" stop-color="#7B00FF" />
    </linearGradient>
    <linearGradient id="akitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>
    <linearGradient id="enaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC77AA" />
      <stop offset="100%" stop-color="#773366" />
    </linearGradient>
    <pattern id="comicDots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="4" fill="#000000" opacity="0.12" />
    </pattern>
    <pattern id="diagStripes" width="40" height="40" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#FFFFFF" stroke-width="12" opacity="0.15" />
    </pattern>
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  
  <!-- Comic Dot Pattern & Stripes -->
  <rect width="1920" height="1080" fill="url(#comicDots)" />
  <rect width="1920" height="1080" fill="url(#diagStripes)" />

  <!-- Speed Burst Rays -->
  <g opacity="0.25" stroke="#FFFFFF" stroke-width="4">
    <line x1="960" y1="540" x2="0" y2="0" stroke-width="8" />
    <line x1="960" y1="540" x2="480" y2="0" />
    <line x1="960" y1="540" x2="960" y2="0" stroke-width="6" />
    <line x1="960" y1="540" x2="1440" y2="0" />
    <line x1="960" y1="540" x2="1920" y2="0" stroke-width="8" />
    <line x1="960" y1="540" x2="1920" y2="540" />
    <line x1="960" y1="540" x2="1920" y2="1080" stroke-width="8" />
    <line x1="960" y1="540" x2="1440" y2="1080" />
    <line x1="960" y1="540" x2="960" y2="1080" stroke-width="6" />
    <line x1="960" y1="540" x2="480" y2="1080" />
    <line x1="960" y1="540" x2="0" y2="1080" stroke-width="8" />
    <line x1="960" y1="540" x2="0" y2="540" />
  </g>

  <!-- Dynamic Geometric Blocks -->
  <rect x="120" y="80" width="460" height="120" rx="16" fill="#111111" transform="rotate(-4 350 140)" filter="url(#popShadow)" />
  <text x="350" y="160" fill="#FFDD00" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" text-anchor="middle" transform="rotate(-4 350 140)" letter-spacing="4">GOODBYE</text>

  <rect x="1340" y="860" width="480" height="130" rx="16" fill="#00F0FF" transform="rotate(3 1580 925)" filter="url(#popShadow)" />
  <text x="1580" y="945" fill="#111111" font-family="'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" text-anchor="middle" transform="rotate(3 1580 925)" letter-spacing="6">SENSATION</text>

  <!-- Center Character Silhouette / Iconic Pop Emblem -->
  <!-- Akito & Ena Dual Color Aura Circles -->
  <circle cx="760" cy="540" r="320" fill="url(#akitoGrad)" opacity="0.85" filter="url(#popShadow)" />
  <circle cx="1160" cy="540" r="320" fill="url(#enaGrad)" opacity="0.85" filter="url(#popShadow)" />

  <!-- Dual Kanji Badges -->
  <rect x="560" y="720" width="260" height="90" rx="12" fill="#FF7700" stroke="#FFFFFF" stroke-width="6" filter="url(#popShadow)" transform="rotate(-6 690 765)" />
  <text x="690" y="782" fill="#FFFFFF" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="44" font-weight="900" text-anchor="middle" transform="rotate(-6 690 765)">東雲 彰人</text>

  <rect x="1100" y="720" width="260" height="90" rx="12" fill="#883366" stroke="#FFFFFF" stroke-width="6" filter="url(#popShadow)" transform="rotate(6 1230 765)" />
  <text x="1230" y="782" fill="#FFFFFF" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="44" font-weight="900" text-anchor="middle" transform="rotate(6 1230 765)">東雲 絵名</text>

  <!-- Main Center Title -->
  <g transform="translate(960, 540)" filter="url(#popShadow)">
    <rect x="-420" y="-80" width="840" height="160" rx="24" fill="#111111" />
    <rect x="-410" y="-70" width="820" height="140" rx="18" fill="#FFE600" />
    <text x="0" y="32" fill="#111111" font-family="'Impact', 'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif" font-size="92" font-weight="900" text-anchor="middle" letter-spacing="8">グッバイ宣言</text>
  </g>

  <!-- Top Decorative Tape -->
  <polygon points="820,20 1100,20 1080,70 800,70" fill="#00F0FF" opacity="0.9" transform="rotate(2 960 45)" />
  <text x="950" y="55" fill="#111111" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="4">PROJECT SEKAI COVER</text>
</svg>
